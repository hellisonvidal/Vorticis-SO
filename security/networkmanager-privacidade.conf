# Vorticis SO — privacidade em redes Wi-Fi
[device]
wifi.scan-rand-mac-address=yes

[connection]
# MAC aleatório estável por rede: o roteador não rastreia o aparelho entre redes diferentes
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=preserve
ipv6.ip6-privacy=2
connection.mdns=1
connection.llmnr=0

[main]
dns=systemd-resolved
