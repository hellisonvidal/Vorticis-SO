#!/usr/sbin/nft -f
# Vorticis SO — firewall padrão
#  * nega toda conexão de ENTRADA não solicitada
#  * permite saída, loopback, ICMP essencial, DHCP e mDNS na rede local
#  * contas Infantis: DNS forçado para resolvedor com filtro familiar
flush ruleset

table inet vorticis {
    set infantil_uids {
        type uid
        # preenchido por /usr/lib/vorticis/vorticis-rede a partir de /etc/vorticis/infantil-uids
    }

    set servicos_permitidos_tcp {
        type inet_service
        # portas abertas pelo usuário via: vorticis-rede abrir 22/tcp
    }

    set servicos_permitidos_udp {
        type inet_service
    }

    chain entrada {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept
        iifname "lo" accept

        # ICMP / ICMPv6 essenciais (path MTU, vizinhança IPv6) com limite contra flood
        ip protocol icmp icmp type { echo-request } limit rate 5/second accept
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip6 nexthdr icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big, time-exceeded, parameter-problem, destination-unreachable } accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 5/second accept

        udp dport 68 accept                      comment "DHCPv4 cliente"
        udp dport 546 ip6 saddr fe80::/10 accept comment "DHCPv6 cliente"
        udp dport 5353 ip daddr 224.0.0.251 accept comment "mDNS (impressoras, Chromecast)"
        udp dport 5353 ip6 daddr ff02::fb accept

        # Waydroid (Android) e contêineres usam interface própria
        iifname { "waydroid0", "podman0" } accept

        tcp dport @servicos_permitidos_tcp ct state new limit rate 30/minute accept
        udp dport @servicos_permitidos_udp accept

        # varreduras de porta: registra com limite e descarta
        limit rate 3/minute log prefix "vorticis-bloqueado: " level info
    }

    chain encaminhar {
        type filter hook forward priority filter; policy drop;
        ct state { established, related } accept
        iifname { "waydroid0", "podman0" } accept
    }

    chain saida_nat {
        type nat hook output priority -100; policy accept;
        # Filtro familiar: Cloudflare for Families (malware + conteúdo adulto)
        meta nfproto ipv4 meta skuid @infantil_uids meta l4proto { tcp, udp } th dport 53 dnat ip to 1.1.1.3:53
        meta nfproto ipv6 meta skuid @infantil_uids meta l4proto { tcp, udp } th dport 53 dnat ip6 to [2606:4700:4700::1113]:53
    }

    chain saida {
        type filter hook output priority filter; policy accept;
        # Contas infantis não podem contornar o filtro com DNS-over-TLS/HTTPS próprio
        meta skuid @infantil_uids tcp dport 853 reject
    }
}
