# Primeiro usuário = Administrador do Vorticis
defaultGroups:
  - name: sudo
    must_exist: true
  - name: vorticis-admin
    must_exist: false
    system: true
  - audio
  - video
  - netdev
  - plugdev
  - lpadmin
  - kvm
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 8
  maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, vorticis ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "vorticis-${cpu}"
