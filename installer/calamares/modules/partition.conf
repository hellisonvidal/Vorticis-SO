efiSystemPartition: "/boot/efi"
efi:
  recommendedSize: 512MiB
  minimumSize: 300MiB
userSwapChoices: [ none, file ]   # zram cuida da maior parte; arquivo de swap opcional para hibernar
initialSwapChoice: none
drawNestedPartitions: true
alwaysShowPartitionLabels: true
# Btrfs: permite snapshots/rollback (roteiro v1.0); ext4 continua disponível
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
initialPartitioningChoice: alongside   # padrão: instalar ao lado do Windows sem apagar nada
enableLuksAutomatedPartitioning: true  # criptografia de disco opcional
