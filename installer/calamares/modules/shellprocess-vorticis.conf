# Passos do Vorticis executados dentro do sistema recém-instalado
dontChroot: false
timeout: 1800
script:
  - command: "apt-get purge -y calamares calamares-settings-debian live-boot live-config live-config-systemd"
    timeout: 300
  # GRUB de plataforma conforme o firmware (UEFI ou BIOS), a partir dos pacotes da imagem
  - command: "sh -c 'export DEBIAN_FRONTEND=noninteractive; if [ -d /sys/firmware/efi ]; then dpkg -i /usr/share/vorticis/pacotes/grub-efi-amd64_*.deb; else dpkg -i /usr/share/vorticis/pacotes/grub-pc_*.deb; fi; rm -rf /usr/share/vorticis/pacotes; update-grub'"
    timeout: 600
  - "/usr/bin/vorticis-usuarios configurar"
  - "rm -f /var/lib/vorticis/primeiro-boot-feito"
  - "systemctl enable vorticis-primeiro-boot.service"
