# Calamares — instalador gráfico do Vorticis SO (executado a partir do pen-drive/live)
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - shellprocess@vorticis
      - initramfs
      - grubcfg
      - bootloader
      - packages
      - umount
  - show:
      - finished

branding: vorticis
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false

instances:
  - id: vorticis
    module: shellprocess
    config: shellprocess-vorticis.conf
