name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gerar_iso:
        description: "Gerar a ISO"
        type: boolean
        default: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas Python compilam
        run: for f in tools/vorticis-* shell/vorticis-shell; do python3 -m py_compile "$f"; done
      - name: Ferramentas respondem --help
        run: for f in tools/vorticis-*; do python3 "$f" --help > /dev/null; done
      - name: Simulações
        run: |
          python3 tools/vorticis-recursos aplicar --simular
          python3 tools/vorticis-usuarios criar teste --nivel infantil --simular
          python3 tools/vorticis-compat preparar todos --simular
          python3 tools/vorticis-drivers sugerir
      - name: Scripts shell (shellcheck)
        run: shellcheck -S warning build/build.sh installer/linux/vorticis-instalar-daqui build/config/hooks/normal/*.hook.chroot
      - name: Regras do firewall (nft -c)
        run: sudo apt-get install -y nftables && sudo nft -c -f security/nftables.conf
      - name: JSON dos temas
        run: for f in shell/themes/*.json; do python3 -m json.tool "$f" > /dev/null; done

  iso:
    if: github.event_name == 'workflow_dispatch' && inputs.gerar_iso || startsWith(github.ref, 'refs/tags/v')
    needs: verificar
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y live-build ca-certificates
      - run: ./build/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vorticis-iso
          path: build/vorticis-*.iso*
