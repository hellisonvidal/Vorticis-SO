name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      gerar_iso:
        description: "Gerar a ISO (artefato do workflow)"
        type: boolean
        default: false
      publicar_versao:
        description: "Publicar release com esta versão (ex.: 0.2). Vazio = só artefato"
        type: string
        default: ""

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas Python compilam
        run: for f in tools/vorticis-* shell/vorticis-shell shell/vorticis-app; do head -1 "$f" | grep -q python || continue; python3 -m py_compile "$f"; done
      - name: Análise estática (pyflakes)
        run: |
          pip install pyflakes
          for f in tools/vorticis-* shell/vorticis-shell shell/vorticis-app; do head -1 "$f" | grep -q python || continue; python3 -m pyflakes "$f"; done
      - name: JavaScript válido
        run: for f in shell/js/*.js shell/apps/*/*.js branding/*.js; do node --check "$f"; done
      - name: Referência de comandos em dia
        run: python3 docs/gerar-referencia.py --verificar
      - name: Pacote vorticis-sistema
        run: |
          sh pacote/gerar-deb.sh 0.0.0-ci /tmp/deb
          dpkg-deb -I /tmp/deb/vorticis-sistema_0.0.0-ci_all.deb
          dpkg-deb -c /tmp/deb/vorticis-sistema_0.0.0-ci_all.deb | grep -q usr/bin/vorticis-atualizar
      - name: Ferramentas respondem --help
        run: for f in tools/vorticis-*; do head -1 "$f" | grep -q python || continue; [ "$(basename $f)" = vorticis-midia ] && continue; python3 "$f" --help > /dev/null; done
      - name: Simulações
        run: |
          python3 tools/vorticis-recursos aplicar --simular
          python3 tools/vorticis-usuarios criar teste --nivel infantil --simular
          python3 tools/vorticis-compat preparar todos --simular
          python3 tools/vorticis-compat receitas
          python3 tools/vorticis-apps catalogo
          python3 tools/vorticis-drivers sugerir
          python3 tools/vorticis-sistema info
          python3 tools/vorticis-dispositivos listar
          python3 tools/vorticis-diagnostico verificar --json > /dev/null
          python3 tools/vorticis-atualizar instalar --simular --so-vorticis
      - name: Scripts shell (shellcheck)
        run: shellcheck -S warning pacote/gerar-deb.sh pacote/DEBIAN/postinst pacote/DEBIAN/prerm build/build.sh shell/vorticis-sessao tools/vorticis-instalar-arquivo tools/vorticis-instalar-sistema installer/linux/vorticis-instalar-daqui build/config/hooks/live/*.hook.chroot build/config/includes.chroot/usr/lib/live/config/2000-vorticis-sessao
      - name: Regras do firewall (nft -c)
        run: sudo apt-get install -y nftables && sudo nft -c -f security/nftables.conf
      - name: JSON válidos
        run: for f in shell/themes/*.json shell/apps/central/catalogo.json tools/compat/receitas.json; do python3 -m json.tool "$f" > /dev/null; done

  windows:
    # O instalador para Windows, testado num Windows de verdade
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe e análise (PSScriptAnalyzer)
        shell: powershell
        run: |
          $t = $null; $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\installer\windows\Instalar-Vorticis.ps1", [ref]$t, [ref]$e) | Out-Null
          if ($e.Count) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer installer\windows\Instalar-Vorticis.ps1 -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Instalador em modo simulação (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\Instalar-Vorticis.ps1 -Simular
      - name: Gerar Instalar-Vorticis.exe
        shell: powershell
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress | Out-Null }
          & $nsis /V2 /DVERSAO=0.0.0 installer\windows\instalador.nsi
          if (-not (Test-Path installer\windows\Instalar-Vorticis.exe)) { exit 1 }

  iso:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.gerar_iso || inputs.publicar_versao != ''))
    needs: [verificar, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço em disco no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - name: Gerar a ISO (Debian 13 + live-build, contêiner privilegiado)
        run: |
          VERSAO="${{ inputs.publicar_versao }}"
          [ -n "$VERSAO" ] || VERSAO="${GITHUB_REF_NAME#v}"
          case "$VERSAO" in [0-9]*) ;; *) VERSAO="0.2-teste" ;; esac
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          sudo docker run --rm --privileged -v "$PWD":/src -w /src -e VORTICIS_VERSAO="$VERSAO" \
            -e VORTICIS_TRABALHO=/tmp/vorticis debian:trixie \
            bash -c "apt-get update && apt-get install -y live-build ca-certificates curl && ./build/build.sh"
          ls -la build/
      - name: Gerar Instalar-Vorticis.exe
        run: |
          sudo apt-get install -y nsis
          VNUM=$(echo "$VERSAO" | grep -oE '^[0-9]+(\.[0-9]+){0,2}')
          case "$VNUM" in *.*.*) ;; *.*) VNUM="$VNUM.0" ;; *) VNUM="0.0.0" ;; esac
          makensis -V2 -DVERSAO="$VNUM" installer/windows/instalador.nsi
      - name: Conferir tamanho (limite de 2 GiB por arquivo nas releases do GitHub)
        run: |
          TAM=$(stat -c %s build/vorticis-*.iso)
          echo "Tamanho da ISO: $((TAM / 1024 / 1024)) MiB"
          if [ "$TAM" -ge 2147483648 ]; then
            echo "ISO maior que 2 GiB: dividindo em partes"
            cd build && split -b 1900M -d "vorticis-${VERSAO}-amd64.iso" "vorticis-${VERSAO}-amd64.iso.parte" && rm "vorticis-${VERSAO}-amd64.iso"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.publicar_versao == '' }}
        with:
          name: vorticis-iso
          path: build/vorticis-*
          retention-days: 7
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar_versao != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: Vorticis SO ${{ env.VERSAO }}
          body_path: docs/NOTAS-DA-VERSAO.md
          files: |
            build/vorticis-*
            installer/windows/Instalar-Vorticis.exe
            installer/windows/Instalar-Vorticis.ps1
            installer/windows/vorticis.ico
            installer/linux/vorticis-instalar-daqui
