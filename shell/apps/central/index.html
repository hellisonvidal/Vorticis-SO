<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central de Apps Vorticis</title>
  <link rel="stylesheet" href="../comum/app.css">
  <style>
    .banner {
      border-radius: 18px; padding: 26px 28px; margin-bottom: 22px; position: relative; overflow: hidden;
      background: linear-gradient(120deg, var(--destaque-forte), #052a52);
    }
    .banner h2 { font-size: 24px; }
    .banner p { margin: 6px 0 0; color: #d9efff; max-width: 560px; }
    .destaques { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 26px; }
    .app-cartao { display: flex; gap: 14px; align-items: flex-start; }
    .app-cartao .icone {
      width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; flex-shrink: 0;
      background: linear-gradient(145deg, var(--cor, #1e7fd0), color-mix(in srgb, var(--cor, #1e7fd0) 50%, #001022));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    }
    .app-cartao .texto { flex: 1; min-width: 0; }
    .app-cartao b { display: block; }
    .app-cartao p { margin: 4px 0 10px; color: var(--texto-suave); font-size: 13px; line-height: 1.35; }
    .secao { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 10px; }
    .secao h3 { margin: 0; font-size: 16px; }
    .progresso-inst { height: 4px; border-radius: 4px; background: var(--superficie-2); overflow: hidden; margin-top: 6px; }
    .progresso-inst i { display: block; height: 100%; width: 40%; background: var(--destaque); animation: corre 1.1s infinite ease-in-out; }
    @keyframes corre { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    .origem { font-size: 11px; }
  </style>
</head>
<body>
  <header class="cabecalho">
    <h1><span class="logo-app">🛍️</span> Central de Apps</h1>
    <span class="espaco"></span>
    <input id="busca" class="campo" type="search" placeholder="Buscar apps (Linux, Windows, Android)…" style="width:min(340px,50vw)">
  </header>
  <div class="corpo">
    <nav class="lateral" id="lateral"></nav>
    <main class="conteudo" id="conteudo"></main>
  </div>
  <script src="../comum/app.js"></script>
  <script src="central.js"></script>
</body>
</html>
