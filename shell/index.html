<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vorticis Shell</title>
  <link rel="stylesheet" href="css/vorticis.css">
</head>
<body>
  <div id="papel" aria-hidden="true"></div>

  <main id="area">
    <section class="relogio-grande" aria-live="polite">
      <div id="hora-grande">--:--</div>
      <div id="data-grande"></div>
    </section>
  </main>

  <!-- Menu iniciar -->
  <section id="menu" class="painel" hidden aria-label="Menu Vorticis">
    <input id="busca" type="search" placeholder="Buscar apps, arquivos e configurações…" autocomplete="off">
    <h2>Aplicativos</h2>
    <div id="grade-apps" class="grade-apps"></div>
    <footer class="menu-rodape">
      <div class="usuario">
        <span class="avatar">H</span>
        <div><strong id="nome-usuario">Usuário</strong><small id="nivel-usuario">Administrador</small></div>
      </div>
      <div class="acoes">
        <button id="abrir-config" title="Configurações">⚙️</button>
        <button title="Bloquear">🔒</button>
        <button title="Desligar">⏻</button>
      </div>
    </footer>
  </section>

  <!-- Configurações rápidas -->
  <section id="config" class="painel" hidden aria-label="Personalização">
    <h2>Personalização</h2>
    <h3>Tema</h3>
    <div id="lista-temas" class="lista-temas"></div>
    <h3>Qualidade do fundo animado</h3>
    <div class="segmentado" id="qualidade">
      <button data-q="auto">Automática</button>
      <button data-q="alto">Alta (GPU)</button>
      <button data-q="leve">Leve (CPU)</button>
      <button data-q="estatico">Estática</button>
    </div>
    <p class="dica" id="qualidade-info"></p>
    <h3>Perfil da barra de tarefas</h3>
    <div id="lista-perfis" class="lista-perfis"></div>
  </section>

  <!-- Barra de tarefas -->
  <nav id="barra" aria-label="Barra de tarefas">
    <button id="botao-iniciar" class="botao-iniciar" title="Menu Vorticis" aria-expanded="false">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9be3ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient></defs>
        <path d="M16 3c5 6 9 10.5 9 15a9 9 0 0 1-18 0c0-4.5 4-9 9-15z" fill="url(#g)"/>
        <path d="M11.5 18.5a4.5 4.5 0 0 0 4.5 4.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
      </svg>
    </button>
    <div id="fixados" class="fixados"></div>
    <div class="bandeja">
      <span id="indicador-perfil" class="chip" title="Perfil ativo"></span>
      <span title="Rede: conectada, firewall ativo">🛡️</span>
      <span title="Volume">🔊</span>
      <span id="bateria" title="Energia">🔌</span>
      <time id="relogio"></time>
    </div>
  </nav>

  <div id="aviso" class="aviso" role="status" hidden></div>

  <script src="js/agua.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
